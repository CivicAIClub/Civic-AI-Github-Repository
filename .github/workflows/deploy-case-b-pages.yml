name: Deploy Case B to GitHub Pages

# Publishes the Music Studio Vite app to gh-pages/case-b so each
# case in this monorepo gets its own independent Pages URL:
#   https://civicaiclub.github.io/Civic-AI-Github-Repository/case-b/

on:
  push:
    branches: [main]
    paths:
      - "projects/case-b-music-studio/**"
      - ".github/workflows/deploy-case-b-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

# Shared with deploy-case-a-pages.yml so the two never write to gh-pages
# at the same moment.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/case-b-music-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/case-b-music-studio/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # Vite reads VITE_* env vars at build time and inlines them into
          # the bundle. Both come from repo secrets so the deployed JS has
          # the right /exec URL and shared secret without anyone having to
          # commit .env.local. The shared secret IS visible in the bundle
          # — that's the documented model for this app, and the deployed
          # URL is treated as semi-private.
          VITE_APPS_SCRIPT_BASE_URL: ${{ secrets.VITE_APPS_SCRIPT_BASE_URL }}
          VITE_APPS_SCRIPT_SHARED_SECRET: ${{ secrets.VITE_APPS_SCRIPT_SHARED_SECRET }}
        run: npm run build

      # GitHub Pages serves only `/404.html` from the root of the publishing
      # source; deep links inside this case-b sub-app would otherwise refresh
      # into a 404. Mirroring index.html here keeps in-app navigation working
      # for direct entry into the app's own shell.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Ensure .nojekyll
        run: touch dist/.nojekyll

      - name: Publish to gh-pages /case-b
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: projects/case-b-music-studio/dist
          destination_dir: case-b
          keep_files: true
          enable_jekyll: false
          commit_message: "deploy case-b: ${{ github.sha }}"
