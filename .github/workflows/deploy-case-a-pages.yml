name: Deploy Case A (AutoPlanner) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "projects/case-a-clc-workflow/frontend/**"
      - ".github/workflows/deploy-case-a-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shares the repo’s single GitHub Pages site with other deploy workflows.
# If Case B (or another) also deploys to `github-pages`, only the latest run wins;
# coordinate in team settings or use workflow_dispatch when you need this UI live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site (SPA fallback for deep links)
        run: |
          FRONT=projects/case-a-clc-workflow/frontend
          cp "$FRONT/index.html" "$FRONT/404.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/case-a-clc-workflow/frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
